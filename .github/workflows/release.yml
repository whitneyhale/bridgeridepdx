# Release when versionName in android/app/build.gradle.kts has no GitHub release yet,
# and only after the full Android CI (unit tests, lint, Maestro on an emulator) passed on that commit.
# Bump versionName and versionCode, add docs/test-cards/v<versionName>.md, push: the APK is published
# as a pre-release with that test card.
name: Release

on:
  workflow_run:
    workflows: [Android]
    types: [completed]
    branches: [main, phase-1]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Version and test card
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ -f "docs/test-cards/$v.md" ] || { echo "missing docs/test-cards/$v.md"; exit 1; }
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        if: steps.v.outputs.skip == 'false'
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
        if: steps.v.outputs.skip == 'false'
      - name: Unit tests and APK
        if: steps.v.outputs.skip == 'false'
        working-directory: android
        run: ./gradlew :core:test :app:assembleDebug
      - name: Publish pre-release
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "bridgeride-$TAG.apk"
          gh release create "$TAG" "bridgeride-$TAG.apk" --target "$SHA" \
            --prerelease --title "Bridge Ride $TAG" --notes-file "docs/test-cards/$TAG.md"
