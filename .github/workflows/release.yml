# Tag v0.1.0 (matching versionName) -> APK attached to a GitHub pre-release with its test card.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Tag must match versionName
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "versionName $v does not match tag ${GITHUB_REF_NAME}"; exit 1; }
          [ -f "docs/test-cards/${GITHUB_REF_NAME}.md" ] || { echo "missing docs/test-cards/${GITHUB_REF_NAME}.md"; exit 1; }
      - name: Unit tests and APK
        working-directory: android
        run: ./gradlew :core:test :app:assembleDebug
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "bridgeride-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" "bridgeride-${GITHUB_REF_NAME}.apk" \
            --prerelease --title "Bridge Ride ${GITHUB_REF_NAME}" --notes-file "docs/test-cards/${GITHUB_REF_NAME}.md"
