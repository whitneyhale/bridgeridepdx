# Every push: data checks, unit tests, lint, APK, then a Maestro smoke test on an emulator.
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Data checks (JSON valid, name matcher 40 of 40)
        run: |
          for f in data/*.json routing/*.json docs/design/*.json; do python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || exit 1; done
          python tools/match_bridge.py | tee match.txt
          tail -1 match.txt | grep -qE "^([0-9]+) of \1 passed$" || { echo "name matcher cases failed"; exit 1; }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, lint, APK
        working-directory: android
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ui:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: apk, path: apk }
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Maestro smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            maestro test android/maestro/ --format junit --output maestro-report.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro
          path: |
            maestro-report.xml
            ~/.maestro/tests/
