# Release 0.1 smoke test (task 1.3): start a ride, get a fix, hold to stop, ride appears in the list.
appId: pdx.bridgeride.app
---
- launchApp:
    clearState: true
- assertVisible: "Bridge Ride"
- assertVisible: "Start ride"
- setLocation:
    latitude: 45.5134
    longitude: -122.6740
- tapOn: "Start ride"
# Permission dialogs differ by Android version; tap whichever appears.
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Only this time"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- assertVisible: "Hold to stop"
- setLocation:
    latitude: 45.5134
    longitude: -122.6720
- extendedWaitUntil:
    visible: "GPS good.*"
    timeout: 30000
- longPressOn: "Hold to stop"
- extendedWaitUntil:
    visible: "Start ride"
    timeout: 10000
- assertVisible: "Ride, .*"
