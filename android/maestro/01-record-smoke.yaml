# Release 0.1 smoke test (task 1.3), kept current: record with no line to follow, get a fix,
# hold to end, see the summary, and the ride appears in the log.
appId: pdx.bridgeride.app
---
- launchApp:
    clearState: true
- assertVisible: "Record only"
- setLocation:
    latitude: 45.5134
    longitude: -122.6740
- tapOn: "Record only"
# Permission dialogs differ by Android version; tap whichever appears.
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Only this time"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- assertVisible: "End"
- assertVisible: "Recording"
- setLocation:
    latitude: 45.5134
    longitude: -122.6720
- extendedWaitUntil:
    visible: "GPS good.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "Bike marker, position good.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: shot-1-recording-light
- longPressOn: "End"
- extendedWaitUntil:
    visible: "RIDE SAVED"
    timeout: 15000
- assertVisible: "Ride, .*"
- assertVisible: "None on this ride."
- scrollUntilVisible:
    element: "Done"
    direction: DOWN
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Record only"
    timeout: 10000
- tapOn: "Library"
- assertVisible: "Ride log"
- assertVisible: "Ride, .*"
