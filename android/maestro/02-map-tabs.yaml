# Release 0.2 (task 1.2): the map loads with all 28 bridge ends; tabs are Map, Library, Settings.
appId: pdx.bridgeride.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Map, 28 bridge ends, light"
    timeout: 30000
- assertVisible: "Locate"
- assertVisible: "Plan a ride"
- assertVisible: "Record only"
- tapOn: "Library"
- assertVisible: "Ride log"
- tapOn: "Settings"
- assertVisible: "Bridge Ride [0-9]+\\.[0-9]+\\.[0-9]+.*"
- assertVisible: "Look"
- assertVisible: "Battery.*"
- tapOn: "Map"
- extendedWaitUntil:
    visible: "Map, 28 bridge ends, light"
    timeout: 30000
