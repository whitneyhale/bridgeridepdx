# Release 0.2 (task 1.2): the map loads with all 28 bridge ends; tabs are Map, Library, Settings.
appId: pdx.bridgeride.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Map, 28 bridge ends"
    timeout: 20000
- assertVisible: "Locate"
- assertVisible: "Start ride"
- tapOn: "Library"
- assertVisible: "Ride log"
- tapOn: "Settings"
- assertVisible: "Bridge Ride 0.2.0.*"
- assertVisible: "Battery.*"
- tapOn: "Map"
- assertVisible: "Map, 28 bridge ends"
