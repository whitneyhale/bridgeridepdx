<div style="background: #FFFFFF; border-radius: 14px; overflow: hidden;">
<label style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px; border-bottom: 1px solid #E1E7E4;"><span style="flex-grow: 1;"><span style="display: block; font-size: 15px;">Use overpasses only when needed</span><span style="display: block; font-size: 13px; color: #4A5A54;">Low preference. The Blumenauer Bridge is always preferred.</span></span><input type="checkbox" checked style="width: 24px; height: 24px; accent-color: #1B6B45;"></label>

<label style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px;"><span style="flex-grow: 1;"><span style="display: block; font-size: 15px;">Warn about streetcar and MAX tracks</span></span><input type="checkbox" checked style="width: 24px; height: 24px; accent-color: #1B6B45;"></label>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 6px;">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; color: #4A5A54; text-transform: uppercase; letter-spacing: 0.6px;">Riding</h2>
<div style="background: #FFFFFF; border-radius: 14px; overflow: hidden;">

<a href="Welcome.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 8px 14px; text-decoration: none; color: #15211D;"><span><span style="display: block; font-size: 15px;">Battery check for tracking</span><span style="display: block; font-size: 13px; color: #4A5A54;">Samsung settings that can stop GPS when the screen locks</span></span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5A54" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"></path></svg></a>

<section style="display: flex; flex-direction: column; gap: 6px;">

</div>
</section>
