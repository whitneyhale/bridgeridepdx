<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bridge Ride PDX</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100%; }
    #status { position: absolute; z-index: 1000; top: 10px; left: 10px; right: 10px;
      background: #fff; padding: 8px 12px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 14px; }
  </style>
</head>
<body>
  <div id="status">Bridge Ride PDX</div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([45.5231, -122.6765], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Show the rider's position and heading when available.
    let marker = null;
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, heading } = pos.coords;
        if (!marker) marker = L.circleMarker([latitude, longitude], { radius: 8 }).addTo(map);
        marker.setLatLng([latitude, longitude]);
        const h = heading == null || Number.isNaN(heading) ? 'unknown' : Math.round(heading) + ' deg';
        document.getElementById('status').textContent = 'Position locked. Heading: ' + h;
      }, err => {
        document.getElementById('status').textContent = 'GPS: ' + err.message;
      }, { enableHighAccuracy: true });
    }

    // Bridge data (coordinates are null until sourced).
    fetch('../data/bridges.json').then(r => r.json()).then(d => {
      d.bridges.filter(b => b.lat != null).forEach(b =>
        L.marker([b.lat, b.lng]).addTo(map).bindPopup(b.name));
    }).catch(() => {});
  </script>
</body>
</html>
